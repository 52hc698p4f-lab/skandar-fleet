<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg"><title>SKANDAR Fleet</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--dark:#0b1220;--blue:#2563eb;--green:#16803c;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial}button,input,select,textarea{font:inherit}
header{background:linear-gradient(135deg,#0b1220,#1d2b49);color:white;padding:20px 16px 16px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:23px}header p{margin:5px 0 0;color:#aeb8c9;font-size:13px}
nav{position:sticky;top:77px;z-index:9;background:white;border-bottom:1px solid var(--line);display:flex;gap:7px;padding:9px;overflow:auto}nav button{border:0;background:#eef2f6;padding:10px 14px;border-radius:12px;font-weight:800;white-space:nowrap}nav .active{background:#0b1220;color:white}
main{max-width:1050px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:0 4px 18px #1018280b}.title{margin:0 0 12px;font-size:18px;font-weight:900}.muted{color:var(--muted);font-size:13px}.stat{font-size:26px;font-weight:900;margin-top:5px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:850}.dark{background:var(--dark);color:white}.blue{background:var(--blue);color:white}.green{background:var(--green);color:white}.gray{background:#eef1f5}.red{background:var(--red);color:white}
input,select,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:11px;background:white}textarea{min-height:90px}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:14px;padding:12px}.badge{display:inline-block;padding:4px 8px;background:#eef2ff;border-radius:999px;font-size:11px;font-weight:800}.success{color:var(--green)}.danger{color:var(--red)}.empty{text-align:center;padding:25px;color:var(--muted)}
table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:9px;border-bottom:1px solid var(--line);font-size:13px}
</style></head><body>
<header><h1>SKANDAR Fleet</h1><p>نظام إدارة السيارات والفواتير والتصدير</p></header><nav id="nav"></nav><main id="app"></main>
<script>
const DB="skandar_fleet_db";let data=JSON.parse(localStorage.getItem(DB)||'{"cars":[],"invoices":[],"exports":[]}');let page="home";
const menu=[["home","الرئيسية"],["cars","السيارات"],["invoices","الفواتير"],["exports","التصدير"],["backup","البيانات"]];
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const val=id=>document.getElementById(id)?.value||"";const n=x=>Number(x||0);const id=()=>crypto.randomUUID?.()||Date.now()+"-"+Math.random();
const money=x=>n(x).toLocaleString("pl-PL",{minimumFractionDigits:2,maximumFractionDigits:2});
function save(){localStorage.setItem(DB,JSON.stringify(data));render()}
function car(id){return data.cars.find(x=>x.id===id)}
function nav(){document.getElementById("nav").innerHTML=menu.map(m=>`<button class="${page===m[0]?'active':''}" onclick="page='${m[0]}';render()">${m[1]}</button>`).join("")}
function render(){nav();document.getElementById("app").innerHTML=views[page]();if(page==="cars")drawCars()}
const views={
home:()=>{let b=data.invoices.filter(x=>x.type==="شراء").reduce((a,x)=>a+n(x.amount),0),s=data.invoices.filter(x=>x.type==="بيع").reduce((a,x)=>a+n(x.amount),0),c=data.invoices.filter(x=>x.type==="مصاريف").reduce((a,x)=>a+n(x.amount),0);
return `<div class="grid"><div class="card"><div class="muted">السيارات</div><div class="stat">${data.cars.length}</div></div><div class="card"><div class="muted">الشراء</div><div class="stat">${money(b)}</div></div><div class="card"><div class="muted">البيع</div><div class="stat">${money(s)}</div></div><div class="card"><div class="muted">الربح</div><div class="stat ${s-b-c>=0?'success':'danger'}">${money(s-b-c)}</div></div></div>
<div class="card"><h2 class="title">إدارة سريعة</h2><div class="actions"><button class="btn dark" onclick="newCar()">+ سيارة</button><button class="btn blue" onclick="newInvoice()">+ فاتورة</button><button class="btn green" onclick="newExport()">+ تصدير</button></div></div>
<div class="card"><h2 class="title">آخر السيارات</h2>${data.cars.slice(-5).reverse().map(c=>`<div class="item" onclick="openCar('${c.id}')"><b>${esc(c.make)} ${esc(c.model)}</b> — ${esc(c.plate)}<div class="muted">${esc(c.vin)}</div></div>`).join("")||'<div class="empty">ابدأ بإضافة أول سيارة</div>'}</div>`},
cars:()=>`<div class="card"><div class="row"><h2 class="title">ملفات السيارات</h2><button class="btn dark" onclick="newCar()">+ سيارة</button></div><input id="search" placeholder="بحث باللوحة أو VIN أو الماركة..." oninput="drawCars()"><div id="cars" class="list" style="margin-top:10px"></div></div>`,
invoices:()=>`<div class="card"><div class="row"><h2 class="title">الفواتير</h2><button class="btn blue" onclick="newInvoice()">+ فاتورة</button></div><div class="list">${data.invoices.slice().reverse().map(x=>`<div class="item"><div class="row"><b>${esc(x.number||"فاتورة")}</b><span class="badge">${esc(x.type)}</span></div><p>${esc(car(x.carId)?.plate||"")} · ${esc(x.party||"")} · <b>${money(x.amount)} ${esc(x.currency||"PLN")}</b></p><div class="muted">${esc(x.date||"")}</div></div>`).join("")||'<div class="empty">لا توجد فواتير</div>'}</div></div>`,
exports:()=>`<div class="card"><div class="row"><h2 class="title">التصدير</h2><button class="btn green" onclick="newExport()">+ عملية تصدير</button></div><div class="list">${data.exports.slice().reverse().map(x=>`<div class="item"><b>${esc(car(x.carId)?.plate||"")}</b> — ${esc(x.destination||"")}<p class="muted">EAD: ${esc(x.ead||"-")} · MRN: ${esc(x.mrn||"-")} · الشحن: ${esc(x.shipper||"-")}</p></div>`).join("")||'<div class="empty">لا توجد عمليات تصدير</div>'}</div></div>`,
backup:()=>`<div class="card"><h2 class="title">البيانات والنسخ الاحتياطي</h2><p class="muted">حالياً البيانات محفوظة محلياً. لا تحذف المتصفح أو بيانات الموقع قبل أخذ نسخة احتياطية.</p><div class="actions"><button class="btn green" onclick="backup()">تصدير نسخة</button><label class="btn gray">استيراد<input id="restore" type="file" accept=".json" hidden></label></div><hr><button class="btn red" onclick="wipe()">حذف الكل</button></div>`
};
function drawCars(){let q=(val("search")||"").toLowerCase();document.getElementById("cars").innerHTML=data.cars.filter(c=>(c.plate+" "+c.vin+" "+c.make+" "+c.model).toLowerCase().includes(q)).map(c=>`<div class="item"><div class="row"><div><b>${esc(c.make)} ${esc(c.model)}</b><br><span class="badge">${esc(c.plate||"بدون لوحة")}</span> <span class="badge">${esc(c.vin||"بدون VIN")}</span></div><button class="btn gray" onclick="openCar('${c.id}')">فتح</button></div><div class="muted" style="margin-top:7px">${esc(c.year)} · ${esc(c.mileage)} km · ${esc(c.country)}</div></div>`).join("")||'<div class="empty">لا يوجد نتائج</div>'}
function form(title,body,fn){document.getElementById("app").innerHTML=`<div class="card"><h2 class="title">${title}</h2>${body}<div class="actions"><button id="save" class="btn dark">حفظ</button><button class="btn gray" onclick="render()">إلغاء</button></div></div>`;document.getElementById("save").onclick=fn}
function inp(i,l,x="",t="text"){return `<div class="field"><label>${l}</label><input id="${i}" type="${t}" value="${esc(x)}"></div>`}
function selectCar(){return `<div class="field full"><label>السيارة</label><select id="carId">${data.cars.map(c=>`<option value="${c.id}">${esc(c.plate)} — ${esc(c.make)} ${esc(c.model)}</option>`).join("")}</select></div>`}
function newCar(c={}){form(c.id?"تعديل السيارة":"سيارة جديدة",`<div class="formgrid">${inp("plate","رقم اللوحة",c.plate)}${inp("vin","VIN / الشاصي",c.vin)}${inp("make","الماركة",c.make)}${inp("model","الموديل",c.model)}${inp("year","السنة",c.year,"number")}${inp("mileage","الكيلومترات",c.mileage,"number")}${inp("color","اللون",c.color)}${inp("country","بلد الشراء",c.country)}${inp("engine","المحرك",c.engine)}<div class="field full"><label>ملاحظات</label><textarea id="notes">${esc(c.notes)}</textarea></div></div>`,()=>{let z={id:c.id||id(),plate:val("plate"),vin:val("vin"),make:val("make"),model:val("model"),year:val("year"),mileage:val("mileage"),color:val("color"),country:val("country"),engine:val("engine"),notes:val("notes")};let i=data.cars.findIndex(x=>x.id===z.id);i<0?data.cars.push(z):data.cars[i]=z;save()})}
function newInvoice(){if(!data.cars.length)return alert("أضف سيارة أولاً");form("فاتورة جديدة",`<div class="formgrid">${selectCar()}<div class="field"><label>النوع</label><select id="type"><option>شراء</option><option>بيع</option><option>مصاريف</option></select></div>${inp("number","رقم الفاتورة")}${inp("date","التاريخ","", "date")}${inp("party","البائع / المشتري")}${inp("amount","المبلغ","", "number")}${inp("currency","العملة","PLN")}${inp("tax","VAT","", "number")}<div class="field full"><label>ملاحظات</label><textarea id="notes"></textarea></div></div>`,()=>{data.invoices.push({id:id(),carId:val("carId"),type:val("type"),number:val("number"),date:val("date"),party:val("party"),amount:val("amount"),currency:val("currency"),tax:val("tax"),notes:val("notes")});save()})}
function newExport(){if(!data.cars.length)return alert("أضف سيارة أولاً");form("عملية تصدير",`<div class="formgrid">${selectCar()}${inp("date","تاريخ التصدير","", "date")}${inp("destination","الوجهة")}${inp("shipper","شركة الشحن")}${inp("exportNo","رقم التصدير")}${inp("mrn","MRN")}${inp("ead","EAD")}${inp("transport","رقم النقل")}<div class="field full"><label>ملاحظات</label><textarea id="notes"></textarea></div></div>`,()=>{data.exports.push({id:id(),carId:val("carId"),date:val("date"),destination:val("destination"),shipper:val("shipper"),exportNo:val("exportNo"),mrn:val("mrn"),ead:val("ead"),transport:val("transport"),notes:val("notes")});save()})}
function openCar(cid){let c=car(cid),ii=data.invoices.filter(x=>x.carId===cid),ee=data.exports.filter(x=>x.carId===cid),b=ii.filter(x=>x.type==="شراء").reduce((a,x)=>a+n(x.amount),0),s=ii.filter(x=>x.type==="بيع").reduce((a,x)=>a+n(x.amount),0),co=ii.filter(x=>x.type==="مصاريف").reduce((a,x)=>a+n(x.amount),0);
document.getElementById("app").innerHTML=`<div class="card"><div class="row"><div><h2 class="title">${esc(c.make)} ${esc(c.model)}</h2><span class="badge">${esc(c.plate)}</span></div><button class="btn gray" onclick='newCar(data.cars.find(x=>x.id=="${cid}"))'>تعديل</button></div><div class="formgrid"><p><b>VIN</b><br>${esc(c.vin)}</p><p><b>السنة</b><br>${esc(c.year)}</p><p><b>KM</b><br>${esc(c.mileage)}</p><p><b>بلد الشراء</b><br>${esc(c.country)}</p></div></div><div class="grid"><div class="card"><div class="muted">شراء</div><div class="stat">${money(b)}</div></div><div class="card"><div class="muted">مصاريف</div><div class="stat">${money(co)}</div></div><div class="card"><div class="muted">بيع</div><div class="stat">${money(s)}</div></div><div class="card"><div class="muted">الربح</div><div class="stat ${s-b-co>=0?'success':'danger'}">${money(s-b-co)}</div></div></div><div class="card"><div class="row"><h3>الفواتير</h3><button class="btn blue" onclick="newInvoiceFor('${cid}')">+ فاتورة</button></div>${ii.map(x=>`<div class="item">${esc(x.number)} · ${esc(x.type)} · <b>${money(x.amount)} ${esc(x.currency)}</b></div>`).join("")||'<div class="empty">لا توجد</div>'}</div><div class="card"><div class="row"><h3>التصدير</h3><button class="btn green" onclick="newExportFor('${cid}')">+ تصدير</button></div>${ee.map(x=>`<div class="item">${esc(x.destination)} · EAD ${esc(x.ead||"-")} · MRN ${esc(x.mrn||"-")}</div>`).join("")||'<div class="empty">لا توجد</div>'}</div><div class="actions"><button class="btn gray" onclick="page='cars';render()">رجوع</button><button class="btn red" onclick="delCar('${cid}')">حذف</button></div>`}
function newInvoiceFor(cid){newInvoice();setTimeout(()=>document.getElementById("carId").value=cid)}
function newExportFor(cid){newExport();setTimeout(()=>document.getElementById("carId").value=cid)}
function delCar(cid){if(confirm("حذف السيارة وكل بياناتها؟")){data.cars=data.cars.filter(x=>x.id!==cid);data.invoices=data.invoices.filter(x=>x.carId!==cid);data.exports=data.exports.filter(x=>x.carId!==cid);save()}}
function backup(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="SKANDAR-Fleet-backup.json";a.click()}
function wipe(){if(confirm("حذف جميع البيانات؟")){data={cars:[],invoices:[],exports:[]};save()}}
document.addEventListener("change",e=>{if(e.target.id==="restore"){let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();alert("تم الاستيراد")}catch{alert("الملف غير صالح")}};r.readAsText(f)}})
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});render();
</script></body></html>
